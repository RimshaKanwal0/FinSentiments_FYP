{% extends 'base/base.html' %}

{% block content %}
<div class="container mt-4">
    <div class="row justify-content-center">
        <div class="col-md-10">
            <div class="card shadow">
                <div class="card-header bg-primary text-white">
                    <h3 class="card-title">Perform Financial Sentiment Analysis</h3>
                </div>
                <div class="card-body">
                    <form method="post" action="{% url 'analysis:perform-analysis' %}" enctype="multipart/form-data">
                        {% csrf_token %}

                        <!-- Mode Selection -->
                        <div class="form-group">
                            <label for="analysis_mode">Select Mode:</label>
                            <select class="form-control" id="analysis_mode" name="analysis_mode" required>
                                <option value="newsapi">Fetch via NewsAPI</option>
                                <option value="upload">Upload CSV Dataset</option>
                            </select>
                        </div>

                        <!-- Mode Description -->
                        <div class="form-group">
                            <label for="mode_description">Mode Description:</label>
                            <textarea class="form-control" id="mode_description" rows="2" readonly></textarea>
                        </div>
                        

                        <!-- Symbol Input (for NewsAPI) -->
                        <div class="form-group" id="symbol_input">
                            <label for="symbol">Company Symbol (e.g.,AAPL,MSFT,TSLA_stock,Bullish):</label>
                            <input type="text" id="symbol" name="symbol" class="form-control">
                        </div>

                        <!-- Dataset Upload (for Upload Mode) -->
                        <div class="form-group" id="dataset_upload" style="display:none;">
                            <label for="dataset">Upload Dataset:</label>
                            <input type="file" id="dataset" name="dataset" class="form-control">
                        </div>

                        <!-- Classifier Selection -->
                        <div class="form-group">
                            <label>Select Classifier:</label>
                            <select class="form-control" name="classifier">
                                <option value="blend_lr_sgd">Blend LR+SGD</option>
                                <option value="blend_lr_sgd_svm">Blend LR+SGD+SVM</option>
                                <option value="blended_SGD_SVM">Blend SGD+SVM</option>
                                <option value="individual_SGD">SGD Only</option>

                            </select>
                        </div>

                        <button type="submit" class="btn btn-primary">Start Analysis</button>
                    </form>
                </div>
            </div>
        </div>
    </div>
</div>

<script>
    function updateModeUI() {
        const mode = document.getElementById('analysis_mode').value;
        const modeDescription = document.getElementById('mode_description');
        const symbolInput = document.getElementById('symbol_input');
        const datasetUpload = document.getElementById('dataset_upload');

        if (mode === 'newsapi') {
            symbolInput.style.display = 'block';
            datasetUpload.style.display = 'none';
            modeDescription.value = "You have selected: Fetch news using NewsAPI for a specific company symbol.";
        } else if (mode === 'upload') {
            symbolInput.style.display = 'none';
            datasetUpload.style.display = 'block';
            modeDescription.value = "You have selected: Upload a CSV dataset for analysis.";
        } else {
            symbolInput.style.display = 'none';
            datasetUpload.style.display = 'none';
            modeDescription.value = "";
        }
    }

    document.getElementById('analysis_mode').addEventListener('change', updateModeUI);
    window.addEventListener('DOMContentLoaded', updateModeUI);
</script>
<br>
<br>
{% endblock %}
