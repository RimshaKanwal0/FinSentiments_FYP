{% extends 'base/base.html' %}

{% block content %}
<div class="container mt-5 mb-5">
    <div class="row justify-content-center">
        <div class="col-md-8">
            <div class="card shadow-lg">
                <div class="card-header bg-primary text-white text-center">
                    <h3><i class="fas fa-envelope"></i> Contact Us</h3>
                    <p class="mb-0">We'd love to hear from you!</p>
                </div>
                <div class="card-body">

                    <form method="post" action="{% url 'frontend:submit_contact' %}">
                        {% csrf_token %}
                        <div class="form-group mb-3">
                            <label for="name" class="font-weight-bold">Name:</label>
                            <input class="form-control" type="text" id="name" name="name" placeholder="Your full name" required>
                        </div>

                        <div class="form-group mb-3">
                            <label for="email" class="font-weight-bold">Email:</label>
                            <input class="form-control" type="email" id="email" name="email" placeholder="example@domain.com" required>
                        </div>

                        <div class="form-group mb-4">
                            <label for="message" class="font-weight-bold">Message:</label>
                            <textarea class="form-control" id="message" name="message" rows="5" placeholder="Write your message here..." required></textarea>
                        </div>

                        <div class="text-center">
                            <button class="btn btn-primary px-4 py-2" type="submit">
                                <i class="fas fa-paper-plane"></i> Send Message
                            </button>
                        </div>
                    </form>

                </div>
                <div class="card-footer text-muted text-center">
                    We usually respond within 24 hours.
                </div>
            </div>
        </div>
    </div>
</div>
{% endblock %}
